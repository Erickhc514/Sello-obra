name: Construir app Android

# Todo el proyecto Android se arma aquí mismo: el repositorio no necesita otros archivos.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Crear el proyecto
        run: |
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app/www"
          cd "$RUNNER_TEMP/app"
          cat > package.json <<'JSON'
          {"name": "sello-de-obra-android", "version": "1.0.0", "private": true, "dependencies": {"@capacitor/android": "6.2.0", "@capacitor/cli": "6.2.0", "@capacitor/core": "6.2.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.erickhc.sellodeobra",
            "appName": "Sello de Obra",
            "webDir": "www",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "androidScheme": "https"
            }
          }
          JSON
          npm install --no-audit --no-fund

      - name: Preparar la app web
        run: |
          W="$RUNNER_TEMP/app/www"
          # Fuentes e íconos desde la app web del repositorio (si existe)
          for f in $(find . -name stamp.js -not -path '*/node_modules/*' -not -path '*/www/*' -not -path '*/assets/*' -not -path './.git/*'); do
            d=$(dirname "$f")
            if [ -d "$d/fonts" ]; then echo "Fuentes e íconos desde: $d"; cp -r "$d/fonts" "$W/" ; [ -d "$d/icons" ] && cp -r "$d/icons" "$W/"; break; fi
          done
          # Código de la app (versión Android)
          base64 -d > "$RUNNER_TEMP/web.tgz" <<'B64'
