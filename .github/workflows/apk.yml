name: Construir app Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'sello-de-obra-app-v2/sello-de-obra-app/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

env:
  WEB_DIR: sello-de-obra-app-v2/sello-de-obra-app

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copiar la app web
        run: |
          rm -rf www && mkdir www
          cp -r "../${WEB_DIR}/." www/
          rm -f www/LEEME.txt

      - name: Instalar Capacitor y sincronizar
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Compilar APK
        working-directory: android-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../../Sello-de-Obra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sello-de-Obra-apk
          path: Sello-de-Obra.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v4.${{ github.run_number }}
          name: Sello de Obra ${{ github.run_number }}
          body: Descarga **Sello-de-Obra.apk** desde el celular e instálala.
          files: Sello-de-Obra.apk
          make_latest: true
  
